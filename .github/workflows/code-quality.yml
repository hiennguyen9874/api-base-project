name: Code Quality Checks

on:
  push:
    tags:
      - v*
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: read

env:
  PYTHON_VERSION: '3.10'
  NODE_VERSION: '22'

jobs:
  # Detect changes to determine which jobs to run
  changes:
    runs-on: ubuntu-22.04
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            backend:
              - 'api/**'
              - '.pre-commit-config.yaml'
            frontend:
              - 'web/**'

  # Backend code quality checks
  backend-quality:
    runs-on: ubuntu-22.04
    needs: changes
    if: needs.changes.outputs.backend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit hooks
        run: uv run --project api --locked pre-commit run --all-files --show-diff-on-failure --color=always

  # Frontend code quality checks
  frontend-quality:
    runs-on: ubuntu-22.04
    needs: changes
    if: needs.changes.outputs.frontend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Run frontend checks
        working-directory: web
        run: |
          pnpm lint
          pnpm format:check
          pnpm build

  # Security scanning
  security-scan:
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run secret scanning
        uses: trufflesecurity/trufflehog@v3.89.2
        with:
          extra_args: --results=verified,unknown

  # CodeQL security analysis
  codeql-analyze:
    runs-on: ubuntu-22.04
    needs: changes
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            path: api
            condition: ${{ needs.changes.outputs.backend == 'true' }}
          - language: javascript
            path: web
            condition: ${{ needs.changes.outputs.frontend == 'true' }}

    steps:
      - name: Checkout code
        if: matrix.condition == 'true'
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        if: matrix.condition == 'true'
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          source-root: ${{ matrix.path }}

      - name: Setup Python (for Python analysis)
        if: matrix.condition == 'true' && matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup pnpm (for JavaScript analysis)
        if: matrix.condition == 'true' && matrix.language == 'javascript'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js (for JavaScript analysis)
        if: matrix.condition == 'true' && matrix.language == 'javascript'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies (JavaScript)
        if: matrix.condition == 'true' && matrix.language == 'javascript'
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Perform CodeQL Analysis
        if: matrix.condition == 'true'
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
