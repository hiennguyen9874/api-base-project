name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  PYTHON_VERSION: '3.10'
  NODE_VERSION: '22'
  PNPM_VERSION: '11.18.0'

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      contract: ${{ steps.filter.outputs.contract }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: .github/paths.yml

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v9
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            api/pyproject.toml
            api/uv.lock

      - name: Install backend dependencies
        working-directory: api
        run: uv sync --locked

      - name: Run backend quality checks
        run: make lint

      - name: Run backend unit tests
        run: make test-api-unit

  backend-db:
    name: Backend DB tests
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cashlens_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d cashlens_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5433/cashlens_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v9
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            api/pyproject.toml
            api/uv.lock

      - name: Install backend dependencies
        working-directory: api
        run: uv sync --locked

      - name: Run backend integration and API tests
        run: make test-api-db

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend lint
        run: pnpm lint

      - name: Check frontend formatting
        run: pnpm format:check

      - name: Run frontend unit tests
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Build frontend production image
        run: |
          docker build \
            --file Dockerfile \
            --target production \
            --build-arg VITE_API_BASE_URL= \
            --build-arg VITE_ENABLE_MSW=false \
            --tag cashlens-web:ci .

  contract:
    name: API client contract
    needs: changes
    if: needs.changes.outputs.contract == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure the supported API stack
        run: cp .env.example .env

      - name: Start the API stack
        run: make up

      - name: Wait for OpenAPI
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://localhost:11112/openapi.json >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose --env-file .env -f compose.yaml -f compose.dev.yaml logs --no-color api prestart || true
          exit 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Regenerate API client
        working-directory: web
        env:
          CASHLENS_OPENAPI_URL: http://localhost:11112/openapi.json
        run: pnpm api:generate

      - name: Check for API client drift
        run: git diff --exit-code -- web/src/api/generated

      - name: Stop the API stack
        if: always()
        run: make down

  required:
    name: CI
    if: always()
    needs: [changes, backend, backend-db, frontend, contract]
    runs-on: ubuntu-latest
    steps:
      - name: Validate required checks
        env:
          RESULTS: >-
            ${{ needs.changes.result }}
            ${{ needs.backend.result }}
            ${{ needs.backend-db.result }}
            ${{ needs.frontend.result }}
            ${{ needs.contract.result }}
        run: |
          echo "Check results: $RESULTS"
          if [[ "$RESULTS" == *failure* || "$RESULTS" == *cancelled* ]]; then
            echo "At least one required CI check failed or was cancelled."
            exit 1
          fi
