name: Release drafter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: release-draft-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  draft_release:
    name: Draft release
    if: github.event_name == 'push' || github.base_ref == 'main'
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      html_url: ${{ steps.release_drafter.outputs.html_url }}
    steps:
      - name: Draft release
        id: release_drafter
        uses: release-drafter/release-drafter@v6
        with:
          publish: false
          disable-releaser: false
          disable-autolabeler: true
          commitish: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate draft summary
        if: github.event_name == 'push'
        run: |
          echo "## 📝 Release Draft Updated" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Draft URL**: ${{ steps.release_drafter.outputs.html_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status**: Ready for manual release" >> "$GITHUB_STEP_SUMMARY"

  auto_label:
    name: Auto-label pull request
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Apply release labels
        uses: release-drafter/release-drafter@v6
        with:
          disable-releaser: true
          disable-autolabeler: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
